# ANCRE indexer — ERC-8004 trust-graph compiler (chantier 03, E2).
# Per-chain mode (disable_default_cross_chain): every row is keyed by (id, chainId).
# Addresses are lowercase. Composite ids use "-".
#
# Layer 1  append-only history, dated by (block, logIndex): replays the registry state at any block.
# Layer 2  current state, rebuilt from events only (Monad serves no historical state beyond ~40k blocks).
# Layer 3  normative edges per anchor set (pseudo-set "ref" = reference schema + filter): D14 (latest non-revoked per (client, agent, tag1),
#          negative dominance across tags), D15 (endorsement tags only), out-of-bounds rejected
#          (never capped), D16/D20 rejection of the target's CURRENT controllers.
#          Port of solver/graph.py (the reference); parity is tested in test/parity.test.ts.
#          The emitter node (D20 row copy, D44 owner fallback) is not frozen here: it is resolved
#          at export / audit time from Agent + WalletAgents.

############ Layer 1 — history

type Feedback {                      # id = agentId-client-feedbackIndex
  id: ID!
  agent: Agent!
  client: String! @index
  feedbackIndex: BigInt!             # 1-based, per (client, agent), all tags
  value: BigInt!                     # exact int128 from the event
  valueDecimals: Int!
  tag1: String!                      # display text: exact iff tag1Exact (else NUL/surrogates escaped, cut at 1 KiB)
  tagHash: String!                   # keccak256(tag1 bytes) = indexedTag1 topic: the only tag identity (AM-04.2)
  tag1Exact: Boolean!                # false: tag1 is NOT the tag (never match it by text; use tagHash)
  tag2: String!                      # display text (src/lib/text.ts safeText)
  endpoint: String!
  feedbackURI: String!
  feedbackHash: String!
  triple: String! @index             # client-agentId-tagHash (D14 unit): fixed length, no raw tag in a key (LONGTAG, NUL)
  blockNumber: BigInt! @index
  logIndex: Int!
  txHash: String!
  txFrom: String!                    # signer; != client when the call is relayed (e.g. EIP-7702 relayers)
  revokedAtBlock: BigInt             # null = active
  clientWasController: String        # owner | operator | agentWallet | approved, evaluated at the feedback's block
}

type WalletChange {                  # MetadataSet(agentWallet); id = block-logIndex
  id: ID!
  agent: Agent!
  wallet: String!                    # 0x0 when cleared (emitted on every transfer)
  blockNumber: BigInt! @index
  logIndex: Int!
}

type OwnerChange {                   # ERC-721 Transfer; id = block-logIndex
  id: ID!
  agent: Agent!
  from: String!
  to: String!
  isMint: Boolean!
  blockNumber: BigInt! @index
  logIndex: Int!
}

type ApprovalChange {                # ERC-721 Approval; id = block-logIndex
  id: ID!
  agent: Agent!
  approved: String!
  blockNumber: BigInt! @index
  logIndex: Int!
}

type OperatorChange {                # ApprovalForAll; id = block-logIndex
  id: ID!
  owner: String! @index
  operator: String!
  approved: Boolean!
  blockNumber: BigInt! @index
  logIndex: Int!
}

type RegistryEvent {                 # Upgraded / OwnershipTransferred on both proxies (D17 watch)
  id: ID!                            # block-logIndex
  registry: String!                  # identity | reputation
  kind: String!                      # Upgraded | OwnershipTransferred
  implementation: String
  newOwner: String
  blockNumber: BigInt!
  txHash: String!
}

############ Layer 2 — current state

type Agent {                         # id = agentId (decimal)
  id: ID!
  owner: String! @index
  wallet: String! @index             # 0x0 when cleared
  approved: String!                  # 0x0 when none; reset by Transfer (ERC-721)
  uri: String!
  registeredBlock: BigInt
  registeredTxFrom: String           # deployer EOA (registration bursts)
  transferCount: Int!
  lastTransferBlock: BigInt          # D10 / D35 (TRANSFERRED)
  refEdgeRows: Int!                  # SetEdge rows pointing to this agent (0 = skip recomputation on controller changes)
  regTx: String                      # tx of the mint: register() emits its MetadataSet(agentWallet) AFTER the ERC-721
  regPhase: String                   # callback; minted | callback | registered | registeredStale | done (REGCB, identity.ts)
  feedbacks: [Feedback!]! @derivedFrom(field: "agent")
  edgesIn: [SetEdge!]! @derivedFrom(field: "agent")
}

type WalletAgents {                  # reverse index wallet -> agents (absent on-chain; D16/D20/D44)
  id: ID!                            # wallet
  agentIds: [String!]!
  count: Int! @index
}

type Operator {                      # id = owner-operator
  id: ID!
  owner: String! @index
  operator: String!
  active: Boolean!
}

############ Layer 3 — normative edges (reference set)

type TripleLatest {                  # D14: latest non-revoked feedback per (client, agent, tag1), every tag
  id: ID!                            # client-agentId-tagHash (never the raw tag: review 06/10, LONGTAG / NUL)
  client: String! @index
  agent: Agent!
  tag1: String!                      # display text (see Feedback.tag1Exact)
  tagHash: String!
  feedback: Feedback                 # null when every feedback of the triple is revoked
}

enum EdgeReject {                     # null = edge retained (solver/from_indexer.py parity semantics)
  NO_ACTIVE_FEEDBACK                 # every filter feedback of the pair has been revoked
  OUT_OF_BOUNDS                      # no tag of the filter yields a weight: every latest feedback is out of bounds (judged per tag, R3)
  ZERO_WEIGHT
  CONTROLLER_OWNER
  CONTROLLER_OPERATOR
  CONTROLLER_WALLET
  CONTROLLER_APPROVED
}

type AnchorSet {                     # "ref" = reference schema (src/lib/schema_reference.json, filter "reference"); else setId
  id: ID!
  kind: String!                      # reference | onchain
  edges: [SetEdge!]! @derivedFrom(field: "set")
  # onchain sets only (AnchorSetRegistered + registerAnchorSet calldata); null for "ref"
  anchors: [String!]
  lambdas: [String!]                 # WAD
  alphaN: BigInt                     # uint32 on chain: may exceed Int32 (review 06/10, SW2)
  alphaD: BigInt
  tagsJson: String                   # [{tag, min, neutral, max, kind}] bounds in WAD: the set's edge schema (D12)
  policyJson: String                 # full Policy struct (theta, rho, m, q, vetoMax, maxAge, ...)
  ownerFallback: Boolean             # D44
  registryVerified: Boolean          # D32
  decodable: Boolean                 # false = no registerAnchorSet call (direct or nested in the input) hashes to setId:
                                     # no schema, no audit (null for a set seen only through later events)
  nodesComplete: Boolean             # false while some index < nodeCount has no SetNode (relayed addNodes whose keys could
                                     # not be read yet): filled from nodeKeyAt (Effect, src/lib/nodekeys.ts) on the next use
  nodeCount: Int                     # anchors + appended nodes, as seen by the indexer
  registeredBlock: BigInt
  registeredTx: String
  nodes: [SetNode!]! @derivedFrom(field: "set")
  certificates: [Certificate!]! @derivedFrom(field: "set")
}

############ ANCRE certificates (contract AnchoredReputation) — audit layer (D42)

type SetNode {                       # node table of an on-chain set; id = setId-index (anchors are 0..k-1)
  id: ID!
  set: AnchorSet!
  index: Int! @index
  kind: String!                      # anchor | agent | address
  agentId: String
  address: String
}

enum CertificateStatus {
  AUDITED                            # decoded and audited against the registry state at its block
  UNDECODABLE                        # submitCertificate not called directly (relayer, multicall, Safe): calldata unavailable
  ROOT_MISMATCH                      # decoded rows do not hash to the event's graphRoot (or nCert differs): not the committed graph
  UNKNOWN_SET                        # set registered by an undecodable transaction: no schema to audit against
  NODES_MISSING                      # node table incomplete (an addNodes was undecodable)
}

type Certificate {                   # id = txHash-logIndex
  id: ID!
  set: AnchorSet!
  certBlock: BigInt! @index
  blockNumber: BigInt! @index
  txHash: String!
  submitter: String!
  eEff: BigInt!
  graphRoot: String!
  graphRootMatches: Boolean          # keccak Merkle root of the decoded rows == event graphRoot
  vectorRoot: String!
  versionHash: String!
  nCert: Int!
  numRows: Int!
  registryVerified: Boolean!
  status: CertificateStatus!
  rowsChecked: Int!
  edgesChecked: Int!
  discrepancyCount: Int!
  discrepancies: [Discrepancy!]! @derivedFrom(field: "certificate")
}

type Discrepancy {                   # one audit finding; id = certificateId-n (see src/lib/audit.ts for the kinds)
  id: ID!
  certificate: Certificate!
  set_id: String! @index
  provenAtBlock: BigInt              # EdgeProven / RowVoided on this row after the certificate: remedied on chain
  kind: String! @index               # FABRICATED | INFLATED | OVERSTATED_NEG | OMITTED_NEG | DILUTION | DEFLATED | WRONG_INDEX |
                                     # SOURCE | SOURCE_MISSING | UNKNOWN_AGENT | SHAPE (src/lib/audit.ts)
  proof: String                      # on-chain remedy: proveEdge | proveWallet | refused at submission | none (...)
  u: Int!
  dst: Int
  client: String
  agentId: String
  wCommitted: Int!
  wRegistry: Int!
  bCommitted: BigInt                 # B+ / B- of the row (a declared sPlus is a uint32: SW2)
  bRegistry: BigInt
  rowPlus: BigInt                    # DILUTION / DEFLATED: committed positive sum of the row, amended by later proofs
  rowDeclared: BigInt                # DILUTION / DEFLATED: declared budget (sPlus, else committed sum), amended
  feedbackIndex: BigInt
  registryFeedbackIndex: BigInt
}

type SetHealth {                     # id = setId: what a watcher needs at a glance
  id: ID!
  set: AnchorSet!
  certificates: Int!
  lastCertificate: Certificate
  lastCertBlock: BigInt
  status: String!                    # CLEAN | DISCREPANCY | UNAUDITED | STALE (registry upgraded since the certificate)
  openDiscrepancies: Int!            # findings of the latest certificate not yet remedied on chain
  edgesProven: Int!                  # EdgeProven events (a proof landed on chain)
  rowsVoided: Int!                   # RowVoided events
  transfersFlagged: Int!             # TransferFlagged events (a certified agent changed hands, D35)
  registryChangedAtBlock: BigInt     # RegistryChanged: the ERC-8004 implementation differs from the certified one
  lastEEff: BigInt
}

type SetEdge {                       # combined edge per (set, client, agent): R2-R6 of solver/FORMAT.md
  id: ID!                            # setId-client-agentId
  set: AnchorSet!
  client: String! @index
  agent: Agent!
  w: Int!                            # int16 on the 1e-4 grid (graph.quantize); 0 when rejected
  decidingTag: String
  feedbackIndex: BigInt
  rejected: EdgeReject               # null = retained (w != 0)
  updatedAtBlock: BigInt! @index
}

############ Stats (one row per chain, id = "stats")

type ChainStats {
  id: ID!
  agents: Int!
  transfers: Int!
  feedbacks: Int!
  revoked: Int!
  selfRatings: Int!                  # feedbacks given while the client controlled the target
  outOfRange: Int!                   # |value| >= 1e38
  refEdges: Int!                     # SetEdge rows of the "ref" set with w != 0
  sharedWallets: Int!
  agentsOnSharedWallets: Int!
  lastBlock: BigInt!
}
